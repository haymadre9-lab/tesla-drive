<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<title>Ajedrez · Lichess TV</title>
<style>
html,body{margin:0;height:100%;background:#0b0f17;color:#eef2f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#bar{position:absolute;z-index:3;left:0;right:0;top:0;height:54px;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#0e131d;border-bottom:1px solid #263042}
#bar b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,a.b{font:inherit;font-size:18px;font-weight:700;color:#fff;background:#243247;border:0;border-radius:12px;min-width:48px;height:42px;padding:0 12px;cursor:pointer;display:inline-grid;place-items:center;text-decoration:none;touch-action:manipulation}
button:active,a.b:active{filter:brightness(1.4)}
#stage{position:absolute;left:0;right:0;top:54px;bottom:0;overflow:hidden}
#fr{position:absolute;left:50%;top:0;width:400px;height:444px;border:0;transform-origin:50% 0;background:#1a1a1a}
</style>
</head>
<body>
<div id="bar"><b>♟ Lichess TV · partidas en directo</b><button id="m" aria-label="Más pequeño">−</button><button id="p" aria-label="Más grande">+</button><button id="f" aria-label="Ajustar a la pantalla">Ajustar</button><a class="b" id="ext" target="_blank" rel="noopener" href="https://lichess.org/tv">↗</a></div>
<div id="stage"><iframe id="fr" src="https://lichess.org/tv/frame?theme=brown&bg=dark" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
<script>
'use strict';
(() => {
  /* La página de Lichess TV mide ~400×444 px: aquí se amplía con una escala para llenar la ventana (y se puede ajustar con + y −) */
  const BW = 400, BH = 444, $ = id => document.getElementById(id), fr = $('fr'), st = $('stage');
  const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { } } };
  let manual = parseFloat(ls.get('ajedrez.z')) || 0;
  const fit = () => Math.max(.5, Math.min(st.clientWidth / BW, st.clientHeight / BH));
  const apply = () => { const z = manual || fit(); fr.style.transform = `translateX(-50%) scale(${z.toFixed(3)})`; window.__z = z; };
  $('p').onclick = () => { manual = Math.min(4, (manual || fit()) * 1.15); ls.set('ajedrez.z', manual); apply(); };
  $('m').onclick = () => { manual = Math.max(.5, (manual || fit()) / 1.15); ls.set('ajedrez.z', manual); apply(); };
  $('f').onclick = () => { manual = 0; ls.set('ajedrez.z', ''); apply(); };
  addEventListener('resize', apply); apply();
})();
</script>
<script src="../../glyphs.js"></script>
</body>
</html>
