<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<title>2048</title>
<style>
:root{--bg:#0b0f17;--card:#151b27;--txt:#eef2f8;--dim:#93a0b4;--acc:#3e9bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;height:100%;align-items:center;justify-content:center;gap:5vmin;padding:2vmin}
#board{position:relative;width:min(92vh,58vw);height:min(92vh,58vw);background:#1d2635;border-radius:2.2vmin;padding:1.6vmin;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:1.6vmin;flex:none}
.c{border-radius:1.3vmin;display:grid;place-items:center;font-weight:800;font-size:clamp(18px,8vmin,72px);background:rgba(255,255,255,.06);color:#0b0f17;transition:transform .08s}
.c.pop{transform:scale(1.08)}
#side{display:flex;flex-direction:column;gap:2.4vmin;width:min(34vw,300px)}
.box{background:var(--card);border-radius:2vmin;padding:1.6vmin 2.4vmin;text-align:center}.box small{display:block;color:var(--dim);font-size:clamp(11px,2.6vmin,16px);text-transform:uppercase;letter-spacing:.08em}.box b{font-size:clamp(24px,7vmin,52px);font-variant-numeric:tabular-nums}
.row{display:flex;gap:2vmin}.row .box{flex:1}
button{font:inherit;font-weight:700;font-size:clamp(14px,3.4vmin,22px);color:#fff;background:var(--acc);border:0;border-radius:2vmin;padding:2vmin;cursor:pointer;touch-action:manipulation}
button.s{background:#243247}button:active{filter:brightness(1.35)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vmin}#pad button{padding:1.4vmin;display:grid;place-items:center;min-height:11vmin}#pad svg{width:5vmin;height:5vmin}
#msg{position:absolute;inset:0;border-radius:2.2vmin;background:rgba(11,15,23,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;font-size:clamp(22px,7vmin,48px);font-weight:800;text-align:center}
#msg.on{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="board"><div id="msg"><div id="mt"></div><button id="again">Otra vez</button></div></div>
  <div id="side">
    <div class="row"><div class="box"><small>Puntos</small><b id="sc">0</b></div><div class="box"><small>Récord</small><b id="bs">0</b></div></div>
    <button id="new" class="s">Nueva partida</button>
    <div id="pad"><span></span><button data-d="u" aria-label="Arriba"></button><span></span><button data-d="l" aria-label="Izquierda"></button><button data-d="d" aria-label="Abajo"></button><button data-d="r" aria-label="Derecha"></button></div>
  </div>
</div>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id), N = 4, COL = { 0: 'transparent', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
  const ls = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { } } };
  let g, score = 0, best = +ls.get('g2048.best', 0), over = false, won = false, keepGoing = false;
  const boardEl = $('board'), cells = []; for (let i = 0; i < N * N; i++) { const c = document.createElement('div'); c.className = 'c'; boardEl.insertBefore(c, $('msg')); cells.push(c); }
  const ARW = { u: 'M12 5l-7 8h4v6h6v-6h4z', d: 'M12 19l7-8h-4V5H9v6H5z', l: 'M5 12l8-7v4h6v6h-6v4z', r: 'M19 12l-8 7v-4H5V9h6V5z' };
  document.querySelectorAll('#pad button').forEach(b => { b.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ARW[b.dataset.d]}" fill="currentColor"/></svg>`; b.onclick = () => move(b.dataset.d); });
  const empty = () => { const e = []; g.forEach((r, y) => r.forEach((v, x) => { if (!v) e.push([y, x]); })); return e; };
  function add() { const e = empty(); if (!e.length) return; const [y, x] = e[Math.floor(Math.random() * e.length)]; g[y][x] = Math.random() < .9 ? 2 : 4; return [y, x]; }
  function reset() { g = Array.from({ length: N }, () => Array(N).fill(0)); score = 0; over = won = keepGoing = false; add(); add(); draw(); }
  function draw(newPos) {
    cells.forEach((c, i) => { const v = g[Math.floor(i / N)][i % N]; c.textContent = v || ''; c.style.background = v ? (COL[v] || '#3c3a32') : 'rgba(255,255,255,.06)'; c.style.color = v > 4 ? '#fff' : '#0b0f17'; c.style.fontSize = v > 999 ? 'clamp(14px,6vmin,56px)' : ''; c.classList.remove('pop'); });
    if (newPos) { const c = cells[newPos[0] * N + newPos[1]]; c.classList.add('pop'); setTimeout(() => c.classList.remove('pop'), 90); }
    $('sc').textContent = score; if (score > best) { best = score; ls.set('g2048.best', best); } $('bs').textContent = best;
  }
  const line = a => { const f = a.filter(Boolean), o = []; let gain = 0; for (let i = 0; i < f.length; i++) { if (f[i] === f[i + 1]) { o.push(f[i] * 2); gain += f[i] * 2; i++; } else o.push(f[i]); } while (o.length < N) o.push(0); return [o, gain]; };
  function move(d) {
    if (over) return; const before = JSON.stringify(g); let gain = 0;
    const get = (i) => d === 'l' || d === 'r' ? g[i].slice() : g.map(r => r[i]), set = (i, a) => { if (d === 'l' || d === 'r') g[i] = a; else a.forEach((v, k) => { g[k][i] = v; }); };
    for (let i = 0; i < N; i++) { let a = get(i); if (d === 'r' || d === 'd') a.reverse(); let [o, s] = line(a); gain += s; if (d === 'r' || d === 'd') o.reverse(); set(i, o); }
    if (JSON.stringify(g) === before) return; score += gain; const p = add(); draw(p);
    if (!keepGoing && g.some(r => r.some(v => v >= 2048))) { won = true; show('¡2048!', true); }
    else if (!canMove()) { over = true; show('Fin de la partida'); }
  }
  const canMove = () => { if (empty().length) return true; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (x < N - 1 && g[y][x] === g[y][x + 1]) return true; if (y < N - 1 && g[y][x] === g[y + 1][x]) return true; } return false; };
  function show(t, cont) { $('mt').textContent = t; $('again').textContent = cont ? 'Seguir jugando' : 'Otra vez'; $('again').onclick = () => { $('msg').classList.remove('on'); if (cont) keepGoing = true; else reset(); }; $('msg').classList.add('on'); }
  $('new').onclick = () => { $('msg').classList.remove('on'); reset(); };
  addEventListener('keydown', e => { const m = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd' }[e.key]; if (m) { e.preventDefault(); move(m); } });
  let t0 = null; const sw = (x, y) => { if (!t0) return; const dx = x - t0.x, dy = y - t0.y; t0 = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u')); };
  document.addEventListener('touchstart', e => { if (e.target.closest('button')) return; t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  document.addEventListener('touchend', e => sw(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });
  document.addEventListener('mousedown', e => { if (!e.target.closest('button')) t0 = { x: e.clientX, y: e.clientY }; }); document.addEventListener('mouseup', e => sw(e.clientX, e.clientY));
  reset(); window.__g = { move, line, get grid() { return g; }, set grid(v) { g = v; draw(); }, get score() { return score; }, get over() { return over; } };
})();
</script>
</body>
</html>
