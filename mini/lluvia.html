<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<title>Radar de lluvia</title>
<link rel="stylesheet" href="../vendor/leaflet.css">
<style>
html,body{margin:0;height:100%;background:#0b0f17;color:#eef2f8;font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#m{position:absolute;inset:0}
#bar{position:absolute;z-index:1000;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;background:rgba(10,14,22,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:8px 12px}
#bar button{font:inherit;font-size:20px;color:#fff;background:#3e9bff;border:0;border-radius:12px;min-width:46px;height:44px;cursor:pointer}
#bar input{flex:1;min-width:60px;height:30px}
#lab{min-width:92px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
#msg{position:absolute;z-index:1001;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,14,22,.82);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:14px;max-width:90%;text-align:center}
#msg[hidden]{display:none}
.leaflet-container{background:#0b0f17}
.me{width:18px;height:18px;border-radius:50%;background:#3e9bff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(62,155,255,.3)}
</style>
</head>
<body>
<div id="m"></div>
<div id="msg" hidden></div>
<div id="bar"><button id="pp" title="Animación">⏸</button><input id="sl" type="range" min="0" max="0" value="0"><span id="lab">--:--</span></div>
<script src="../vendor/leaflet.js"></script>
<script>
'use strict';
(() => {
  const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  let la = parseFloat(Q.get('lat')), lo = parseFloat(Q.get('lon')); if (!Number.isFinite(la) || !Number.isFinite(lo)) { la = 40.4168; lo = -3.7038; }
  const map = L.map('m', { zoomControl: true, attributionControl: true }).setView([la, lo], +Q.get('z') || 7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', { subdomains: 'abcd', maxZoom: 12, attribution: '© OpenStreetMap © CARTO · radar © RainViewer' }).addTo(map);
  const me = L.marker([la, lo], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
  const say = t => { const m = $('msg'); m.hidden = !t; m.textContent = t || ''; };
  let frames = [], layers = [], idx = 0, timer = 0, playing = true;
  const fmt = ts => { const d = new Date(ts * 1000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  function show(i) {
    idx = (i + frames.length) % frames.length; layers.forEach((l, k) => l.setOpacity(k === idx ? .75 : 0));
    $('sl').value = idx; const f = frames[idx]; $('lab').textContent = fmt(f.time) + (f.fut ? ' ▸ previsión' : '');
  }
  const play = () => { clearInterval(timer); if (playing) timer = setInterval(() => show(idx + 1), 700); $('pp').textContent = playing ? '⏸' : '▶'; };
  async function load() {
    say('Cargando radar…');
    try {
      const c = new AbortController(), tm = setTimeout(() => c.abort(), 15000), r = await fetch('https://api.rainviewer.com/public/weather-maps.json', { signal: c.signal }); clearTimeout(tm);
      if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(), host = j.host || 'https://tilecache.rainviewer.com';
      frames = ((j.radar && j.radar.past) || []).map(f => ({ time: f.time, path: f.path })).concat(((j.radar && j.radar.nowcast) || []).map(f => ({ time: f.time, path: f.path, fut: true })));
      if (!frames.length) throw new Error('sin imágenes de radar');
      layers.forEach(l => map.removeLayer(l)); layers = frames.map(f => L.tileLayer(host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', { opacity: 0, maxNativeZoom: 7, maxZoom: 12, zIndex: 5 }).addTo(map));
      $('sl').max = frames.length - 1; show(frames.findIndex(f => f.fut) > 0 ? frames.findIndex(f => f.fut) - 1 : frames.length - 1); say(''); play();
    } catch (e) { say('No se pudo cargar el radar de lluvia (' + (e.name === 'AbortError' ? 'tarda demasiado' : e.message) + '). Se reintentará en 1 minuto.'); setTimeout(load, 60000); }
  }
  $('pp').onclick = () => { playing = !playing; play(); }; $('sl').oninput = e => { playing = false; play(); show(+e.target.value); };
  setInterval(load, 10 * 60000); // el radar se actualiza cada ~10 min
  load(); window.__rain = { map, get frames() { return frames; }, show };
})();
</script>
</body>
</html>
