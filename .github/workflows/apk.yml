name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['old-hud/**', '**.md', 'config.json']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Dependencias y proyecto Android
        run: |
          npm install
          node scripts/build-www.js
          npx cap add android
          npx cap sync android
      - name: Permisos, orientación e icono
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' $M
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          R = 'android/app/src/main/res'
          src = Image.open('icon-512.png').convert('RGBA')
          for d, px in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              for n in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  src.resize((px, px), Image.LANCZOS).save(f'{R}/mipmap-{d}/{n}.png')
          PY
      - name: Compilar
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LecoAuto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
