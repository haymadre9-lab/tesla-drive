<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>LecoAuto PWA</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wall"><div class="wl a"></div><div class="wl b"></div></div>
<div id="shade"></div>

<div id="shell">
  <header id="status">
    <div class="st-time"><b id="stTime">--:--</b><span id="stDate"></span></div>
    <div class="st-mid" id="stWeather"></div>
    <div class="st-right">
      <span id="stLimit" class="lim" hidden></span><span id="stSpeed" title="Velocidad GPS">-- km/h</span>
      <span id="stGps" class="dot" title="GPS"></span>
      <button id="btnSearch" class="ic" title="Buscar destino">🔍</button>
      <button id="btnDash" class="ic" title="Dashboards">🎛</button>
      <button id="btnDN" class="ic" title="Día / noche">🌓</button>
      <button id="btnFS" class="ic" title="Pantalla completa">⛶</button>
    </div>
  </header>

  <nav id="dock"></nav>

  <main id="pages">
    <section id="p-home" class="page"></section>
    <section id="p-apps" class="page"></section>
    <section id="p-music" class="page"></section>
    <section id="p-map" class="page"></section>
    <section id="p-advisor" class="page"></section>
    <section id="p-settings" class="page"></section>
  </main>
</div>

<button id="fab" aria-label="Botón flotante"></button>
<div id="floats"></div>
<div id="alertbar" hidden></div>
<button id="imm" title="Menú" type="button">☰</button>
<div id="toast"></div>
<div id="modal" hidden></div>
<input type="file" id="fileAudio" accept="audio/*" multiple hidden>
<input type="file" id="fileLrc" accept=".lrc,text/plain" hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileCfg" accept="application/json,.json" hidden>
<audio id="audio" preload="metadata"></audio>
<script src="vendor/leaflet.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="mapx.js"></script>
<script src="nav.js"></script>
<script src="poi.js"></script>
<script src="app.js"></script>
<script src="dash.js"></script>
<script src="edit.js"></script>
<script src="free.js"></script>
<script src="sync.js"></script>
<script src="maps.js"></script>
<script src="screen.js"></script>
<script src="speedo.js"></script>
<script src="stream.js"></script>
<script src="tpl.js"></script>
<script src="advisor.js"></script>
<script src="placeinfo.js"></script>
<script src="road.js"></script>
<script src="scene.js"></script>
<script src="search.js"></script>
<script src="data.js"></script>
<script src="ai.js"></script>
</body>
</html>
